<!DOCTYPE html>
<html>
<head>
    <title>UNI-verse Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="login-box">
    <h1>UNI-verse</h1>
    <p>University Placement Portal</p>

    <form method="POST">
        <input
            type="text"
            name="registration_no"
            placeholder="Registration Number"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
<p>New student? <a href="/register">Create an account</a></p>
