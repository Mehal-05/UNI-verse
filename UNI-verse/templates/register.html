<!DOCTYPE html>
<html>
<head>
    <title>UNI-verse Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="login-box">
    <h1>UNI-verse</h1>
    <p>Student Registration</p>

    <form method="POST">

        <input type="text" name="registration_no"
               placeholder="Registration Number" required>

        <input type="text" name="name"
               placeholder="Full Name" required>

        <input type="email" name="email"
               placeholder="Email" required>

        <input type="password" name="password"
               placeholder="Password" required>

        <input type="number" name="campus_id"
               placeholder="Campus ID (1 or 2)" required>

        <input type="number" name="department_id"
               placeholder="Department ID (1 to 4)" required>

        <input type="number" step="0.01" name="cgpa"
               placeholder="CGPA" required>

        <input type="number" name="backlogs"
               placeholder="Number of Backlogs" value="0" required>

        <input type="number" name="graduation_year"
               placeholder="Graduation Year" required>

        <button type="submit">Register</button>

    </form>

    <p>Already registered? <a href="/login">Login</a></p>
</div>

</body>
</html>
